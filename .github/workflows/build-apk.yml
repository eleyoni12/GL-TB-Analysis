name: Build IPTV APK

on:
  push:
    branches: ["claude/iptv-apk-program-p9yeik"]
    paths:
      - "iptv-player/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: iptv-player
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp iptv-player/app/build/outputs/apk/debug/app-debug.apk IPTV-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-apk
          path: IPTV-Player.apk

      - name: Publish as GitHub Release (easy download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete iptv-latest --yes --cleanup-tag || true
          gh release create iptv-latest IPTV-Player.apk \
            --target "${{ github.sha }}" \
            --title "IPTV Player (latest build)" \
            --notes "Debug-signed APK, installable directly. Built from ${{ github.sha }}."
